services:
  pc-agent:
    image: ${PC_AGENT_IMAGE:-verdox/solar-miner-pc-agent:latest}
    container_name: solarminer-pc-agent
    restart: unless-stopped
    # Legacy filename compatibility alias for docker-compose.pc-agent.yml.
    # Host networking is the only supported Compose network mode.
    network_mode: host
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
      SERVER_ADDRESS: 0.0.0.0
