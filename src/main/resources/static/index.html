<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1020">
    <title>SolarMiner · Dashboard</title>
    <link rel="stylesheet" href="/css/agent.css">
    <link rel="stylesheet" href="/css/workspace.css">
    <link rel="stylesheet" href="/css/design.css">
    <script src="/js/core/i18n-catalog.js" defer></script>
    <script src="/js/core/i18n.js" defer></script>
    <script src="/js/core/live-data.js" defer></script>
    <script src="/js/core/mining-cache.js" defer></script>
    <script src="/js/core/components.js" defer></script>
    <script src="/js/chrome/proxy-gate.js" defer></script>
    <script src="/js/chrome/workspace.js" defer></script>
    <script src="/js/chrome/wallet-strip.js" defer></script>
    <script src="/js/chrome/telemetry-gate.js" defer></script>
    <script src="/js/pages/overview.js" defer></script>
</head>
<body class="dashboard-page">
<div class="shell">
    <header class="topbar"><a class="brand" href="/">☼ <span>SolarMiner <small>PC-Agent</small></span></a>
        <nav class="nav"><a class="selected" href="/">Dashboard</a><a href="/mining.html">Miner</a><a
                href="/workers.html">Worker</a><a href="/benchmarks.html">Benchmarks</a><a
                href="/hardware.html">Leistungsgrenzen</a><a href="/telemetry.html">Sensoren</a><a
                href="/proxy.html">Verbindung</a></nav>
        <div class="top-actions"><span id="connection" class="badge">Verbinde …</span>
            <button id="refresh" type="button" class="button subtle">Aktualisieren</button>
        </div>
    </header>
    <section id="wallet-strip" class="wallet-strip" aria-label="Wallet-Kontostände"></section>
    <main>
        <div class="page-title">
            <div><p class="kicker">DEIN PC IM ÜBERBLICK</p>
                <h1>Dashboard</h1>
                <p id="updated">Warte auf Daten</p></div>
            <a class="button primary" href="/workers.html">Worker steuern →</a></div>
        <form id="agent-name-form" class="agent-name" autocomplete="off">
            <label for="agent-name-input">Name dieses Agents</label>
            <input id="agent-name-input" type="text" maxlength="40" placeholder="SolarMiner PC Agent">
            <button id="agent-name-save" class="button subtle" type="submit">Speichern</button>
            <span id="agent-name-state" class="agent-name-state" role="status"></span>
        </form>
        <div id="status-strip" class="sticky-strip" aria-label="Betriebsstatus"></div>
        <div id="notice" class="notice error" role="status" aria-live="polite" hidden></div>
        <section id="alerts" class="alert-list" aria-label="Meldungen"></section>
        <div class="dashboard-live-layout">
            <section id="live-workers" class="section live-workers panel" aria-labelledby="live-workers-title">
                <div class="panel-head"><div><p class="kicker">LIVE-BETRIEB</p><h2 id="live-workers-title">Was gerade arbeitet</h2></div>
                    <a href="/workers.html">Alle Worker →</a></div>
                <div id="live-worker-grid" class="live-worker-grid"></div>
            </section>
            <section id="energy-summary" class="section panel energy-summary" aria-labelledby="energy-title">
                <div class="panel-head"><div><p class="kicker">ENERGIE</p><h2 id="energy-title">Verbrauch & Kosten</h2></div>
                    <button id="energy-settings" class="button subtle" type="button">Tarif</button></div>
                <div id="energy-kpis" class="energy-kpis"></div>
                <p id="energy-note" class="muted"></p>
            </section>
        </div>
        <footer>SolarMiner PC-Agent</footer>
    </main>
</div>
</body>
</html>
