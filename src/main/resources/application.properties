spring.application.name=pc-agent
server.port=8084
# The Stratum proxy is never bundled: it is resolved from this GitHub repository at every start
# and run as its own JVM below this directory.
solarminer.agent.proxy.repository=Solarminer-app/solarminer-stratum-proxy
solarminer.agent.proxy.release-dir=./solarminer-agent/proxy-releases
solarminer.agent.proxy.bitcoin-port=3333
solarminer.agent.proxy.monero-port=3335
solarminer.agent.proxy.pearl-port=3334
solarminer.agent.proxy.quantus-port=3339
solarminer.agent.proxy.discovery-port=8091
solarminer.agent.proxy.api-port=8090
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
