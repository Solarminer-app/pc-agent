spring.application.name=pc-agent
server.port=8084
# The SSE publisher and every watchdog share the Spring scheduler. The default pool size of
# one serializes the slow UI sections (GPU discovery, fee/currency HTTP, driver reads) behind
# each other: one slow section stalls all push channels and the browser aborts pending
# requests (visible as Tomcat "non-recycled request" noise). Give the scheduler room.
spring.task.scheduling.pool.size=4
# REST/SSE loading plan P6 (2026-10-11): the publisher sweep runs every 500 ms because a
# sweep now only evaluates channels that are dirty (reported by a local mutation) or whose
# TTL expired — a clean channel costs nothing. Mutations therefore push within < 1 s while
# the per-section TTLs below are the safety net for unreported external changes.
solarminer.agent.events.interval-ms=500
# The Stratum proxy is never bundled: it is resolved from this GitHub repository at every start
# and run as its own JVM below this directory.
solarminer.agent.proxy.repository=Solarminer-app/solarminer-stratum-proxy
solarminer.agent.proxy.release-dir=./solarminer-agent/proxy-releases
solarminer.agent.proxy.bitcoin-port=3333
solarminer.agent.proxy.monero-port=3335
solarminer.agent.proxy.pearl-port=3334
solarminer.agent.proxy.quantus-port=3339
solarminer.agent.proxy.discovery-port=8091
solarminer.agent.proxy.heartbeat-port=8092
solarminer.agent.proxy.api-port=8090
# LAN peer-agent discovery (dashboard visibility): heartbeat/query UDP port, mirrored on peers.
solarminer.agent.network.heartbeat-port=8093
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
