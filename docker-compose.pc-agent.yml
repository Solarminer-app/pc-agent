services:
  pc-agent:
    image: verdox/solar-miner-pc-agent:latest
    container_name: solarminer-pc-agent
    restart: unless-stopped
    # The image includes a local proxy. The UI defaults to an external proxy;
    # operators can switch to the bundled loopback-only proxy at any time.
    ports:
      - "8084:8084"
      # Receives the external proxy's LAN heartbeat. UDP 8091 belongs to the
      # proxy's legacy query listener and must not be published by the Agent.
      - "8092:8092/udp"
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
      SERVER_ADDRESS: 0.0.0.0
