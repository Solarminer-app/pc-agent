services:
  pc-agent:
    image: ${PC_AGENT_IMAGE:-verdox/solar-miner-pc-agent:latest}
    container_name: solarminer-pc-agent
    restart: unless-stopped
    # Supported Linux network mode. The Agent's UDP broadcasts must leave the
    # physical host interface for LAN proxy and peer-agent discovery to work.
    network_mode: host
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
      SERVER_ADDRESS: 0.0.0.0
      SOLARMINER_AGENT_GPU: ${PC_AGENT_GPU:-none}
