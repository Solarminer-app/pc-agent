name: Build and publish SolarMiner PC-Agent beta

on:
  push:
    branches:
      - beta

permissions:
  contents: write

concurrency:
  group: solarminer-pc-agent-beta
  cancel-in-progress: false

jobs:
  metadata:
    name: Read beta image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read image name and commit tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "tag=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=$(./gradlew -q printPcAgentImage)" >> "$GITHUB_OUTPUT"

  publish-beta-image:
    name: Build and publish PC-Agent beta image
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish PC-Agent beta tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.tag }}-amd64-beta
            ${{ needs.metadata.outputs.image }}:latest-amd64-beta
            ${{ needs.metadata.outputs.image }}:latest-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-beta-release-assets:
    name: Build PC-Agent beta release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone PC-Agent JAR
        run: |
          chmod +x ./gradlew
          ./gradlew test standaloneJar --no-daemon

      - name: Verify no Stratum proxy is bundled in the PC-Agent JAR
        shell: bash
        run: |
          set -euo pipefail
          if unzip -l build/distributions/solarminer-pc-agent-standalone.jar \
              | grep -q 'solarminerstratumproxy'; then
            echo "The PC-Agent JAR must not contain Stratum proxy classes." >&2
            exit 1
          fi

      - name: Prepare beta installer and launcher assets
        shell: bash
        run: |
          set -euo pipefail
          cp standalone/start-agent-beta.bat build/distributions/
          cp standalone/start-agent-beta.ps1 build/distributions/
          cp standalone/install-linux.sh build/distributions/
          cp standalone/install-docker.sh build/distributions/
          cp standalone/install-windows.ps1 build/distributions/
          cp docker-compose.pc-agent.yml build/distributions/pc-agent.compose.yml
          cp docker-compose.pc-agent.nvidia.yml build/distributions/pc-agent.nvidia.compose.yml
          cp docker-compose.pc-agent.amd.yml build/distributions/pc-agent.amd.compose.yml
          sh -n build/distributions/install-linux.sh
          sh -n build/distributions/install-docker.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("standalone/install-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          cd build/distributions
          sha256sum solarminer-pc-agent-standalone.jar > solarminer-pc-agent-standalone.jar.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pc-agent-beta-release-assets
          path: build/distributions/*
          if-no-files-found: error
          retention-days: 7

  publish-beta-release:
    name: Publish PC-Agent prerelease
    needs:
      - build-beta-release-assets
      - publish-beta-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-agent-beta-release-assets
          path: release-assets

      - name: Create beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${SHORT_SHA:0:12}"
          TAG="pc-agent-beta-${SHORT_SHA}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SolarMiner PC-Agent Beta ${SHORT_SHA}" \
            --notes "Beta build from commit ${TARGET_SHA}. The beta launcher downloads the latest published PC-Agent beta release." \
            --prerelease \
            --target "$TARGET_SHA"
